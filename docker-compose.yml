services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"
    networks:
      - rinha

  api1:
    image: evinicius16/fraud-detection-knn-go:v1
    environment:
      - PORT=8080
      - IVF_INDEX_PATH=/app/data/ivf_index.bin
      - MCC_RISK_PATH=/app/data/mcc_risk.json
      - NORMALIZATION_PATH=/app/data/normalization.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

  api2:
    image: evinicius16/fraud-detection-knn-go:v1
    environment:
      - PORT=8080
      - IVF_INDEX_PATH=/app/data/ivf_index.bin
      - MCC_RISK_PATH=/app/data/mcc_risk.json
      - NORMALIZATION_PATH=/app/data/normalization.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge