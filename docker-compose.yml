version: "3.8"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"
    networks:
      - rinha

  api1:
    build: .
    environment:
      - PORT=8080
      - IVF_INDEX_PATH=/shared/ivf_index.bin
      - MCC_RISK_PATH=/app/data/mcc_risk.json
      - NORMALIZATION_PATH=/app/data/normalization.json
    volumes:
      - shared-data:/shared:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

  api2:
    build: .
    environment:
      - PORT=8080
      - IVF_INDEX_PATH=/shared/ivf_index.bin
      - MCC_RISK_PATH=/app/data/mcc_risk.json
      - NORMALIZATION_PATH=/app/data/normalization.json
    volumes:
      - shared-data:/shared:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - rinha

  # Init container: copies the IVF index to the shared volume
  data-init:
    build: .
    entrypoint: ["sh", "-c", "cp /app/data/ivf_index.bin /shared/ivf_index.bin && echo 'IVF index copied to shared volume'"]
    volumes:
      - shared-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "20MB"
    networks:
      - rinha

volumes:
  shared-data:

networks:
  rinha:
    driver: bridge
