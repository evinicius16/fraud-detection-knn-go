worker_processes 1;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    # Keep connections alive to backend — avoids TCP handshake per request
    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 512;
    }

    server {
        listen 9999 reuseport;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts slightly above k6's 2001ms limit to avoid premature closes
            proxy_connect_timeout 5s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;
        }
    }
}
